plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

group = 'ru.nsu.kurumun'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'ru.nsu.kurumun.graph.Main'
}

tasks.named('run', JavaExec) {
    standardInput = System.in
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
    }
}
