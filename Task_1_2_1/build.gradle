plugins {
    id 'java'
    id 'application'
}

group = 'ru.nsu.kurumun'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'ru.nsu.kurumun.graph.Main'
}

tasks.named('run', JavaExec) {
    standardInput = System.in
}